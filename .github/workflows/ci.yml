name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated assets are up to date
        run: |
          npm run assets
          git diff --exit-code -- assets || {
            echo "assets/ is out of date; run 'npm run assets' and commit the result" >&2
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
