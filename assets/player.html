<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self'; script-src 'unsafe-inline'" />
    <title>audio host</title>
  </head>
  <body>
    <!--
      Offscreen host window for notification sounds. The main process has no
      audio output of its own, so it drives this hidden page over
      webContents.executeJavaScript.
    -->
    <script>
      let current = null;

      window.playSound = function playSound(file, volume) {
        // A new alert supersedes a siren that is still running.
        if (current) {
          current.pause();
          current = null;
        }
        const audio = new Audio(file);
        audio.volume = Math.max(0, Math.min(1, volume));
        current = audio;
        return audio.play().catch((error) => String(error));
      };

      window.stopSound = function stopSound() {
        if (current) current.pause();
        current = null;
      };
    </script>
  </body>
</html>
