appId: com.killerkiss.ukrainealarmtray
productName: Ukraine Alarm Tray
copyright: MIT

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

# Icons, sounds and the offscreen audio host are read from disk at runtime, so
# they ship as resources rather than being bundled into the asar.
extraResources:
  - from: assets
    to: assets
    filter:
      - icons/**/*
      - sounds/**/*
      - player.html

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icons/app
  maintainer: Killerkiss <kaugorodov.ruslan@gmail.com>
  synopsis: Ukrainian air-raid alerts in your system tray
  description: >
    Tray application for Ukrainian air-raid (drone and missile) alerts with
    per-region selection, desktop notifications, sound and a colour-coded icon.
  # electron-builder 25 takes a flat map here; the nested `entry:` form is
  # from a later major and silently writes a literal "entry=[object Object]".
  desktop:
    StartupWMClass: Ukraine Alarm Tray
    Keywords: alert;alarm;siren;ukraine;tryvoga;povitryana;
  # Spaces in filenames make the install command awkward to type and to paste.
  artifactName: ukrainealarm-tray-${version}-${arch}.${ext}

deb:
  # libnotify backs Electron's desktop notifications; the rest are the usual
  # Chromium runtime libraries. Ubuntu ships all of them, but naming them means
  # apt reports a clear error instead of the app failing to start.
  depends:
    - libnotify4
    - libnss3
    - libxtst6
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

win:
  target:
    - nsis
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.utilities
  icon: assets/icons/icon.png
  # A menu-bar-only app: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
